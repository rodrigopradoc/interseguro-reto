# Configuración de nginx para servir una SPA (Single Page Application) de Angular.
#
# El problema con SPAs es que Angular maneja las rutas en el cliente (browser),
# pero si el usuario recarga la página en /dashboard, nginx busca un archivo
# físico llamado "dashboard" y devuelve 404.
#
# La solución es: para cualquier ruta que no sea un archivo estático,
# devolver siempre index.html y dejar que Angular maneje el routing.

server {
    listen 80;
    server_name localhost;

    # Directorio raíz donde están los archivos compilados de Angular
    root /usr/share/nginx/html;
    index index.html;

    # Habilitar compresión gzip para reducir el tamaño de los archivos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        # try_files: primero busca el archivo exacto ($uri),
        # luego como directorio ($uri/),
        # si no existe, sirve index.html para que Angular maneje la ruta
        try_files $uri $uri/ /index.html;
    }

    # Cache de 1 año para assets con hash (JS, CSS compilados)
    # Angular les pone hash en el nombre, así que son seguros de cachear
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}